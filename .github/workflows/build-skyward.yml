name: build-skyward
on: [workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: skyward
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kirklin/skyward
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
          add-to-path: false
      - name: cargo-ndk
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build skyward (arm64)
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      - name: Build system-init (static)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Gather
        run: |
          mkdir -p out
          cp target/aarch64-linux-android/release/skyward out/
          cp target/system-init/aarch64-linux-android/release/system-init out/
          ls -l out/
      - uses: actions/upload-artifact@v4
        with:
          name: skyward-bin
          path: out/
          if-no-files-found: error
          retention-days: 14
